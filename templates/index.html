<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyberdeck Audit Hub</title><style>body{font-family:system-ui;background:#10141c;color:#e8eef7;max-width:1000px;margin:40px auto;padding:0 20px}section{background:#192231;padding:20px;border-radius:12px;margin:16px 0}input,button{padding:10px;margin:5px;border-radius:6px;border:1px solid #40516b;background:#0f1722;color:#fff}button{cursor:pointer;background:#1769aa}.tool{display:inline-block;margin:6px;padding:10px;background:#24344b;border-radius:8px}.danger{color:#ffb4ab}</style></head><body><h1>Cyberdeck Audit Hub</h1><p class="danger">Mode actif réservé à vos réseaux personnels ou à un laboratoire autorisé.</p><section><h2>Cible autorisée</h2><input id="ssid" placeholder="SSID personnel"><input id="bssid" placeholder="AA:BB:CC:DD:EE:FF"><button onclick="validateTarget()">Valider</button><p id="status"></p></section><section><h2>Outils référencés</h2>{% for t in tools %}<div class="tool"><a href="{{t.url}}" target="_blank" rel="noopener" style="color:#8dccff">{{t.name}}</a><small> — {{t.mode}}</small></div>{% endfor %}</section><script>async function validateTarget(){const r=await fetch('/api/validate-target',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:document.querySelector('#ssid').value,bssid:document.querySelector('#bssid').value})});const d=await r.json();document.querySelector('#status').textContent=d.allowed?'Cible enregistrée pour audit autorisé.':d.reason;}</script></body></html>
